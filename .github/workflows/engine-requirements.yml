name: Engine requirements

# Weekly: moves the engine's hash-pinned requirement files
# (workers/python/requirements-*.txt) to the newest versions their .in
# sources allow, and proposes the change as a pull request. Dependabot can't
# be relied on to regenerate files made by `uv pip compile --universal
# --generate-hashes` (build brief A-4), so this workflow does it. The pull
# request is merged only when CI passes on all three systems.

on:
  schedule:
    - cron: "17 9 * * 1" # Mondays 09:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # push the update branch
      pull-requests: write # open the pull request
      actions: write # start CI on the branch (pushes made with this token don't)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Columbus's own uv, hash-checked.
      - run: python -m pip install --require-hashes --no-deps --only-binary ":all:" -r workers/python/requirements-uv.txt
      - name: Regenerate
        run: python packaging/engine/compile-requirements.py --upgrade
      - name: Propose
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- workers/python; then
            echo "The requirement files are up to date." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          branch="deps/engine-requirements-$(date -u +%Y%m%d)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add workers/python/requirements-*.txt
          git commit -m "Engine requirements: weekly update" -m "Regenerated with python packaging/engine/compile-requirements.py --upgrade."
          git push origin "$branch"
          gh workflow run CI --ref "$branch"
          body="Weekly update of the engine's hash-pinned requirement files (python packaging/engine/compile-requirements.py --upgrade). CI was started on this branch; merge only when every job passes."
          if gh pr create --base "${{ github.event.repository.default_branch }}" --head "$branch" \
               --title "Engine requirements: weekly update" --body "$body"; then
            echo "Opened a pull request from $branch." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::Could not open the pull request (Settings > Actions > General > 'Allow GitHub Actions to create and approve pull requests' may be off). Open it by hand: ${{ github.server_url }}/${{ github.repository }}/compare/$branch?expand=1"
            echo "Open the pull request by hand: ${{ github.server_url }}/${{ github.repository }}/compare/$branch?expand=1" >> "$GITHUB_STEP_SUMMARY"
          fi
