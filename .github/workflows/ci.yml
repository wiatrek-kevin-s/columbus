name: CI

on:
  push:
    # engines-* branches (database engine work) run on push too.
    branches: [main, "engines-*", "macos-*", "app-*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # macos-latest is Apple Silicon.
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: python -m pip install -r workers/python/requirements-gis.txt
      - run: python -m pip install --require-hashes --no-deps --only-binary ":all:" -r workers/python/requirements-projectdb.txt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # The confinement launcher first: if it fails, everything that starts a
      # local server or plugin does, and its own tests say why.
      - run: cargo test -p columbus-mcp --test confine --locked -- --nocapture
      - run: cargo test --workspace --locked --no-fail-fast
        # Still run everything when the launcher tests fail: the other
        # tests' messages help find why.
        if: success() || failure()

  python-worker:
    name: Python worker
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # macos-latest is Apple Silicon.
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r workers/python/requirements-gis.txt
      - run: python -m pip install --require-hashes --no-deps --only-binary ":all:" -r workers/python/requirements-projectdb.txt
      - run: python -m unittest discover -s workers/python/tests -v
      - name: Skills library
        run: python skills/check_skills.py

  companion:
    name: Companion window
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/ui/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: python -m pip install -r workers/python/requirements-gis.txt playwright
      - run: python -m playwright install --with-deps chromium
      - name: Build the window
        working-directory: app/ui
        run: |
          npm ci
          npm audit --omit=dev
          npm run build
      - run: cargo build -p columbus-mcp --locked
      - name: The window in a browser, against a real session
        run: |
          python app/ui/e2e/companion.py target/debug/columbus-mcp
          python app/ui/e2e/edits.py target/debug/columbus-mcp
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: companion-screenshots
          path: app/ui/e2e/out/

  desktop:
    name: Desktop app (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            app/desktop/src-tauri
      - name: Linux build libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libsoup-3.0-dev libayatana-appindicator3-dev librsvg2-dev xvfb
      - name: Build and lint
        working-directory: app/desktop/src-tauri
        run: |
          cargo build --locked
          cargo clippy --locked -- -D warnings
          cargo test --locked
      - name: A workflow's schedule entry is accepted by the system's scheduler (macOS, Windows)
        if: runner.os != 'Linux'
        # Informative: a runner without a desktop session may refuse it.
        continue-on-error: true
        working-directory: app/desktop/src-tauri
        run: cargo test --locked -- --ignored --nocapture the_systems_scheduler
      - name: A page in the main window's frame cannot reach the app
        if: runner.os != 'Linux'
        run: python app/desktop/e2e/frame_ipc.py app/desktop/src-tauri/target/debug/columbus-desktop
      - name: A page in the main window's frame cannot reach the app (Linux)
        if: runner.os == 'Linux'
        run: dbus-run-session -- xvfb-run -a python app/desktop/e2e/frame_ipc.py app/desktop/src-tauri/target/debug/columbus-desktop
      - name: Links reach the running app (macOS)
        if: runner.os == 'macOS'
        run: |
          ( cd app/ui && npm ci && npm run build )
          ( cd app/desktop && npm ci && npx tauri build --debug --bundles app )
          cargo build -p columbus-mcp --locked
          python app/desktop/e2e/deeplink_macos.py target/debug/columbus-mcp app/desktop/src-tauri/target/debug/bundle/macos/Columbus.app
      - name: Links reach the running app (Linux)
        if: runner.os == 'Linux'
        run: |
          python -m pip install -r workers/python/requirements-gis.txt
          ( cd app/ui && npm ci && npm run build )
          cargo build -p columbus-mcp --locked
          dbus-run-session -- xvfb-run -a python app/desktop/e2e/deeplink.py target/debug/columbus-mcp app/desktop/src-tauri/target/debug/columbus-desktop
      - name: The main window (chat, connections, tools, workflows, approvals, audit), driven through WebDriver (Linux)
        if: runner.os == 'Linux'
        run: |
          # The package was renamed in newer Ubuntu releases.
          sudo apt-get install -y webkitgtk-webdriver || sudo apt-get install -y webkit2gtk-driver
          command -v WebKitWebDriver || ls /usr/lib/*/webkit*gtk*/ 2>/dev/null
          cargo install tauri-driver --locked
          python -m pip install selenium
          dbus-run-session -- xvfb-run -a -s "-screen 0 1400x900x24" python app/desktop/e2e/chat.py target/debug/columbus-mcp app/desktop/src-tauri/target/debug/columbus-desktop
          python -m pip install pyyaml
          dbus-run-session -- xvfb-run -a -s "-screen 0 1400x900x24" python app/desktop/e2e/settings.py target/debug/columbus-mcp app/desktop/src-tauri/target/debug/columbus-desktop
          dbus-run-session -- xvfb-run -a -s "-screen 0 1400x900x24" python app/desktop/e2e/shell.py target/debug/columbus-mcp app/desktop/src-tauri/target/debug/columbus-desktop
          dbus-run-session -- xvfb-run -a -s "-screen 0 1400x900x24" python app/desktop/e2e/workflows.py target/debug/columbus-mcp app/desktop/src-tauri/target/debug/columbus-desktop
          dbus-run-session -- xvfb-run -a -s "-screen 0 1400x900x24" python app/desktop/e2e/projects.py target/debug/columbus-mcp app/desktop/src-tauri/target/debug/columbus-desktop
          dbus-run-session -- xvfb-run -a -s "-screen 0 1400x900x24" python app/desktop/e2e/datagroups.py target/debug/columbus-mcp app/desktop/src-tauri/target/debug/columbus-desktop
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-screenshots-${{ matrix.os }}
          path: app/desktop/e2e/out/

  postgis:
    name: PostGIS engine
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gis
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      COLUMBUS_TEST_PG_HOST: localhost
      COLUMBUS_TEST_PG_PORT: "5432"
      COLUMBUS_TEST_PG_DB: gis
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install "psycopg[binary]" -r workers/python/requirements-gis.txt
      - run: python -m pip install --require-hashes --no-deps --only-binary ":all:" -r workers/python/requirements-projectdb.txt
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Load fixture
        run: psql -h localhost -U postgres -d gis -v ON_ERROR_STOP=1 -f crates/gateway/tests/fixtures/postgis.sql
      - name: Worker tests against PostGIS
        run: python -m unittest discover -s workers/python/tests -v
      - name: Gateway end to end against PostGIS
        run: cargo test -p columbus-mcp --test postgis --test gis --test edits --locked -- --nocapture

  oracle:
    name: Oracle engine
    # Pinned: the SQL Server job below needs Microsoft's packages for the
    # release, and both should move together.
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    services:
      oracle:
        # The regular flavor, not -slim: slim uninstalls Oracle Spatial
        # (MDSYS, SDO_GEOMETRY), which the engine and its tests need.
        image: gvenzl/oracle-free:23-faststart
        env:
          ORACLE_PASSWORD: columbus_sys_test
          APP_USER: columbus_rw
          APP_USER_PASSWORD: columbus_rw_test
        ports: ["1521:1521"]
        options: >-
          --health-cmd healthcheck.sh
          --health-interval 10s --health-timeout 5s --health-retries 40
    env:
      COLUMBUS_TEST_ORA_HOST: localhost
      COLUMBUS_TEST_ORA_PORT: "1521"
      COLUMBUS_TEST_ORA_SERVICE: FREEPDB1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r workers/python/requirements-gis.txt -r workers/python/requirements-db.txt
      - run: python -m pip install --require-hashes --no-deps --only-binary ":all:" -r workers/python/requirements-projectdb.txt
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Load fixture
        env:
          ID: ${{ job.services.oracle.id }}
        run: |
          # APP_USER is created during first start-up; wait for it to finish.
          timeout 600 bash -c 'until docker logs "$ID" 2>&1 | grep -q "DATABASE IS READY TO USE"; do sleep 5; done'
          docker cp crates/gateway/tests/fixtures/oracle.sql "$ID":/tmp/oracle.sql
          docker exec "$ID" sqlplus -s -L "system/columbus_sys_test@//localhost/FREEPDB1" @/tmp/oracle.sql
          # A read-only transaction cannot read a table created in the last few
          # seconds (ORA-01466: the time-to-SCN mapping is coarse).
          sleep 15
      - name: Worker tests against Oracle
        run: python -m unittest discover -s workers/python/tests -p "test_db_engines.py" -v && python -m unittest discover -s workers/python/tests -p "test_catalog.py" -v
      - name: Gateway end to end against Oracle
        if: success() || failure()
        run: cargo test -p columbus-mcp --test oracle --locked -- --nocapture

  mssql:
    name: SQL Server engine
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: Columbus_sa_test1
        ports: ["1433:1433"]
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P Columbus_sa_test1 -C -Q 'SELECT 1' -b"
          --health-interval 10s --health-timeout 5s --health-retries 30
    env:
      COLUMBUS_TEST_MSSQL_HOST: localhost
      COLUMBUS_TEST_MSSQL_PORT: "1433"
      COLUMBUS_TEST_MSSQL_DB: gis
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: ODBC Driver 18 for SQL Server
        run: |
          if odbcinst -q -d -n "ODBC Driver 18 for SQL Server" >/dev/null 2>&1; then
            echo "preinstalled on the runner"
          else
            echo "not preinstalled; installing msodbcsql18"
            curl -sSL -o /tmp/ms.deb "https://packages.microsoft.com/config/ubuntu/$(lsb_release -rs)/packages-microsoft-prod.deb"
            sudo dpkg -i /tmp/ms.deb
            sudo apt-get update
            sudo ACCEPT_EULA=Y apt-get install -y msodbcsql18 unixodbc
          fi
          odbcinst -q -d
      - run: python -m pip install -r workers/python/requirements-gis.txt -r workers/python/requirements-db.txt
      - run: python -m pip install --require-hashes --no-deps --only-binary ":all:" -r workers/python/requirements-projectdb.txt
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Load fixture
        env:
          ID: ${{ job.services.mssql.id }}
        run: |
          docker cp crates/gateway/tests/fixtures/mssql.sql "$ID":/tmp/mssql.sql
          docker exec "$ID" /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P Columbus_sa_test1 -C -b -i /tmp/mssql.sql
      - name: Worker tests against SQL Server
        run: python -m unittest discover -s workers/python/tests -p "test_db_engines.py" -v && python -m unittest discover -s workers/python/tests -p "test_catalog.py" -v
      - name: Gateway end to end against SQL Server
        if: success() || failure()
        run: cargo test -p columbus-mcp --test mssql --locked -- --nocapture
