name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: python -m pip install -r workers/python/requirements-gis.txt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  python-worker:
    name: Python worker
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r workers/python/requirements-gis.txt
      - run: python -m unittest discover -s workers/python/tests -v

  postgis:
    name: PostGIS engine
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gis
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      COLUMBUS_TEST_PG_HOST: localhost
      COLUMBUS_TEST_PG_PORT: "5432"
      COLUMBUS_TEST_PG_DB: gis
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install "psycopg[binary]" -r workers/python/requirements-gis.txt
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Load fixture
        run: psql -h localhost -U postgres -d gis -v ON_ERROR_STOP=1 -f crates/gateway/tests/fixtures/postgis.sql
      - name: Worker tests against PostGIS
        run: python -m unittest discover -s workers/python/tests -v
      - name: Gateway end to end against PostGIS
        run: cargo test -p columbus-mcp --test postgis --test gis --locked -- --nocapture
