name: TMP trusted on Windows (diagnostic, removed before merge)

on:
  push:
    branches: ["rework/s4-trusted-windows"]

permissions:
  contents: read

jobs:
  rust:
    name: Trusted tests (windows-latest)
    runs-on: windows-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - run: python -m pip install -r workers/python/requirements-gis.txt
      - run: python -m pip install --require-hashes --no-deps --only-binary ":all:" -r workers/python/requirements-projectdb.txt
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p columbus-mcp --tests --locked
      - name: trusted run test
        timeout-minutes: 12
        run: cargo test -p columbus-mcp --test environments_trusted --locked -- --nocapture --test-threads=1 trusted_runs
        continue-on-error: true
      - name: arcpy probe test
        timeout-minutes: 12
        run: cargo test -p columbus-mcp --test environments_trusted --locked -- --nocapture --test-threads=1 arcpy_licence
        continue-on-error: true
      - name: processes left
        if: always()
        shell: pwsh
        run: Get-CimInstance Win32_Process | Where-Object { $_.Name -match 'python|columbus|taskkill|environments' } | Select-Object ProcessId,ParentProcessId,Name,CommandLine | Format-List
      - name: shared and gateway unit tests
        timeout-minutes: 10
        run: cargo test -p columbus-shared -p columbus-mcp --lib --locked
        continue-on-error: true
