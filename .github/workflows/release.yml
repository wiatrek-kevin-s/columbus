name: Release

# A tag v* builds the Windows server and publishes a zip and a .mcpb bundle
# (the MCP project's one-click format for local servers) to a GitHub release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Publish as this release tag (v plus the version in Cargo.toml, e.g. v0.1.2); empty builds only"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build
        run: cargo build --release --locked -p columbus-mcp
      - name: Assemble
        shell: pwsh
        run: |
          $version = (cargo metadata --format-version 1 --no-deps | ConvertFrom-Json).packages |
            Where-Object name -eq "columbus-mcp" | Select-Object -ExpandProperty version
          $out = "dist\columbus"
          New-Item -ItemType Directory -Force $out | Out-Null
          Copy-Item target\release\columbus-mcp.exe, target\release\columbus-confine.exe $out
          New-Item -ItemType Directory -Force "$out\workers" | Out-Null
          Copy-Item -Recurse workers\python "$out\workers\python"
          Remove-Item -Recurse -Force "$out\workers\python\tests" -ErrorAction SilentlyContinue
          Get-ChildItem -Recurse -Directory -Filter __pycache__ $out | Remove-Item -Recurse -Force
          Copy-Item -Recurse packaging\engine "$out\engine"
          Copy-Item -Recurse skills, docs, examples $out
          Copy-Item README.md, LICENSE $out
          $m = Get-Content packaging\mcpb\manifest.json -Raw | ConvertFrom-Json
          $m.version = $version
          $m | ConvertTo-Json -Depth 10 | Set-Content "$out\manifest.json" -Encoding utf8
          Compress-Archive -Path "$out\*" -DestinationPath "dist\columbus-$version-windows-x64.zip"
          Copy-Item "dist\columbus-$version-windows-x64.zip" "dist\columbus-$version.mcpb"
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Smoke test
        shell: pwsh
        run: dist\columbus\columbus-mcp.exe --version
      - name: Publish
        if: startsWith(github.ref, 'refs/tags/') || inputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag != '' && inputs.tag || github.ref_name }}
        shell: pwsh
        run: |
          # The tag must name the version that was built, so the files, the
          # title and `columbus-mcp --version` all agree with it.
          if ($env:TAG -ne "v$env:VERSION") {
            Write-Error "Tag $env:TAG does not match the built version $env:VERSION: change the version in Cargo.toml first."
            exit 1
          }
          gh release view $env:TAG 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $env:TAG --target $env:GITHUB_SHA --title "Columbus $env:VERSION (test release)" --notes-file docs\install.md --prerelease
          }
          gh release upload $env:TAG "dist\columbus-$env:VERSION-windows-x64.zip" "dist\columbus-$env:VERSION.mcpb" --clobber
      - uses: actions/upload-artifact@v4
        with:
          name: columbus-windows
          path: dist/*.zip
