name: Bug report
description: Something in Columbus doesn't work as it should.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Please **don't paste passwords, tokens or your organization's data**. A security problem goes through [private reporting](https://github.com/wiatrek-kevin-s/columbus/security/advisories/new) instead.
  - type: input
    id: version
    attributes:
      label: Columbus version
      description: "From `columbus-mcp --version`, or the foot of the app's Settings."
      placeholder: "0.15.0"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: System
      options:
        - Windows 11
        - Windows 10
        - macOS (Apple Silicon)
        - Linux (server)
    validations:
      required: true
  - type: dropdown
    id: client
    attributes:
      label: Where you used it
      options:
        - The Columbus app's own chat
        - Claude desktop
        - Another AI app (say which below)
        - The command line
  - type: input
    id: ai
    attributes:
      label: Which AI service or AI app (optional)
      description: "In the app's own chat: the service chosen under Settings › Assistant (Anthropic, OpenAI, xAI, Google Gemini, OpenRouter, Ollama, LM Studio, or one you added) and the model, as the line under the message box names them. With another AI app: which app. Never its key."
      placeholder: "Google Gemini, with the model the chat named"
  - type: textarea
    id: steps
    attributes:
      label: What you did
      description: Step by step, so someone else can do the same. Which kind of connection (GeoPackage, Oracle, ArcGIS layer…)?
      placeholder: |
        1. Added a file geodatabase connection
        2. Asked …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected, and what happened instead
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Messages or logs (optional)
      description: Error text, or a screenshot. Remove anything private first.
      render: text
