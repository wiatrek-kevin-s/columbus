[workspace]
resolver = "2"
members = ["crates/shared", "crates/broker", "crates/flow", "crates/confine", "crates/gateway", "workers/sdk-rust"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/wiatrek-kevin-s/columbus"
rust-version = "1.85"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror = "2"
anyhow = "1"
globset = "0.4"
sha2 = "0.10"
hex = "0.4"
chrono = { version = "0.4", features = ["serde"] }
sqlparser = { version = "0.63", features = ["visitor"] }
schemars = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std", "process", "sync", "time"] }
rmcp = { version = "3.8", features = ["server", "transport-io", "macros", "schemars"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
tempfile = "3"
