[package]
name = "columbus-shared"
description = "Connections, permissions, query checking, approvals, sandbox and audit for Columbus"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
thiserror.workspace = true
globset.workspace = true
sha2.workspace = true
hex.workspace = true
chrono.workspace = true
sqlparser.workspace = true
uuid.workspace = true
schemars.workspace = true
# Ed25519 signatures on shared files.
ring = "0.17"

[dev-dependencies]
tempfile.workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# proctree: a job object that ends a run's whole process tree.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Diagnostics_ToolHelp", "Win32_System_JobObjects", "Win32_System_Threading"] }
