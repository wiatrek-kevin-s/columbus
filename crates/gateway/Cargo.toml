[package]
name = "columbus-mcp"
description = "Governed GIS MCP server: the gateway that enforces Columbus's rules and delegates GIS work to engine workers"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "columbus-mcp"
path = "src/main.rs"

[[bin]]
name = "columbus-confine"
path = "src/bin/confine.rs"

[dependencies]
columbus-shared = { path = "../shared" }
columbus-broker = { path = "../broker" }
columbus-flow = { path = "../flow" }
columbus-confine = { path = "../confine" }
rmcp = { workspace = true, features = ["elicitation"] }
base64 = "0.22"
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
schemars.workspace = true
tokio.workspace = true
anyhow.workspace = true
chrono.workspace = true
uuid.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
rpassword = "7"
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "json"] }
# Registry downloads; TLS comes from the same features rmcp enables.
reqwest = { version = "0.13", default-features = false }

[dev-dependencies]
reqwest = { version = "0.13", default-features = false, features = ["json"] }
tempfile.workspace = true
rmcp = { workspace = true, features = ["client", "transport-child-process", "transport-streamable-http-server"] }
sha2.workspace = true

# Windows Credential Manager. Other platforms have no native store yet.
[target.'cfg(windows)'.dependencies]
keyring-core = "1"
windows-native-keyring-store = "1"
