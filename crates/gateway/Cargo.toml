[package]
name = "columbus-mcp"
description = "Governed GIS MCP server: the gateway that enforces Columbus's rules and delegates GIS work to engine workers"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "columbus-mcp"
path = "src/main.rs"

[[bin]]
name = "columbus-workflow"
path = "src/workflow_launcher.rs"

[[bin]]
name = "columbus-confine"
path = "src/bin/confine.rs"

[dependencies]
tempfile.workspace = true
sha2.workspace = true
columbus-shared = { path = "../shared" }
columbus-broker = { path = "../broker" }
columbus-flow = { path = "../flow" }
columbus-confine = { path = "../confine" }
rmcp = { workspace = true, features = ["elicitation", "client"] }
base64 = "0.22"
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
schemars.workspace = true
tokio.workspace = true
anyhow.workspace = true
chrono.workspace = true
uuid.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
rpassword = "7"
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "json", "query"] }
# Registry downloads; TLS comes from the same features rmcp enables.
reqwest = { version = "0.13", default-features = false }

[dev-dependencies]
columbus-chat = { path = "../chat" }
reqwest = { version = "0.13", default-features = false, features = ["json"] }
tempfile.workspace = true
rmcp = { workspace = true, features = ["client", "transport-child-process", "transport-streamable-http-server"] }

# run_python: ending a script's process group, opening its outputs without
# following links.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Windows Credential Manager, and the macOS Keychain below. Linux has no
# native store yet.
[target.'cfg(windows)'.dependencies]
keyring-core = "1"
windows-native-keyring-store = "1"

[target.'cfg(target_os = "macos")'.dependencies]
keyring-core = "1"
apple-native-keyring-store = { version = "1", features = ["keychain"] }
