# Alternative engine environment from conda-forge (identical GDAL and PDAL
# builds on every machine). `pixi install` in this folder creates
# engine\.pixi\envs\default, which columbus-mcp finds by itself.
[workspace]
name = "columbus-engine"
channels = ["conda-forge"]
platforms = ["win-64", "linux-64", "osx-arm64"]

[dependencies]
python = "3.12.*"
gdal = ">=3.10"
geopandas = ">=1.0,<2"
pyogrio = ">=0.10,<1"
shapely = ">=2.1,<3"
pyproj = ">=3.6,<4"
pandas = ">=2.2,<4"
rasterio = ">=1.4,<2"
pyarrow = ">=15"
pypdf = ">=4,<7"
pillow = ">=10.1,<13"
psycopg = ">=3.2"
oracledb = ">=2.0"
pyodbc = ">=5.1,<6"

pip = "*"

# Project databases: DuckDB and its spatial extension are not taken from
# PyPI by pixi (it cannot pin wheel hashes here); after `pixi install`, run
# `pixi run project-db`, which installs them hash-checked from
# workers/python/requirements-projectdb.txt. Then `pixi run columbus-uv`, which
# installs Columbus's own uv the same way from requirements-uv.txt (used
# only to create environments the person approves).
[tasks]
# Works from the repository (packaging/engine) and from a release
# (engine/ beside workers/).
project-db = '''python -c "import os, subprocess, sys; r = next((p for p in ('../workers/python/requirements-projectdb.txt', '../../workers/python/requirements-projectdb.txt') if os.path.isfile(p)), None); r or sys.exit('requirements-projectdb.txt not found'); sys.exit(subprocess.call([sys.executable, '-m', 'pip', 'install', '--require-hashes', '--no-deps', '--only-binary', ':all:', '-r', r]))"'''
columbus-uv = '''python -c "import os, subprocess, sys; r = next((p for p in ('../workers/python/requirements-uv.txt', '../../workers/python/requirements-uv.txt') if os.path.isfile(p)), None); r or sys.exit('requirements-uv.txt not found'); sys.exit(subprocess.call([sys.executable, '-m', 'pip', 'install', '--require-hashes', '--no-deps', '--only-binary', ':all:', '-r', r]))"'''
