<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Columbus</title>
    <link rel="stylesheet" href="app.css" />
  </head>
  <body>
    <a class="skip" href="#main">Skip to content</a>
    <div class="app">
      <nav class="rail" id="rail" aria-label="Columbus"></nav>
      <main class="main" id="main" tabindex="-1"></main>
    </div>
    <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
    <dialog id="palette" class="palette" aria-label="Search chats and pages">
      <input id="palette-q" type="search" placeholder="Search chats, sessions and pages" aria-label="Search chats, sessions and pages" autocomplete="off" spellcheck="false" role="combobox" aria-expanded="true" aria-controls="palette-list" />
      <ul id="palette-list" role="listbox" aria-label="Results"></ul>
      <p class="hint">↑ ↓ to move · Enter to open · Esc to close. Chats are searched by title and content.</p>
    </dialog>
    <script type="module" src="js/main.js"></script>
  </body>
</html>
