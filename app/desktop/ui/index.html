<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Columbus</title>
    <link rel="stylesheet" href="app.css" />
  </head>
  <body>
    <a class="skip" href="#main">Skip to content</a>
    <div class="app" id="app">
      <!-- The sidebar: a new chat, the search, the places, and recent chats. -->
      <aside class="sidebar" id="sidebar" aria-label="Columbus">
        <div class="sb-top" id="sb-top"></div>
        <nav class="sb-nav" id="nav" aria-label="Places"></nav>
        <div class="sb-recents" id="recents"></div>
        <div class="sb-foot" id="sb-foot"></div>
      </aside>
      <!-- The middle: the conversation, or the page of a place. -->
      <main class="main" id="main" tabindex="-1"></main>
      <!-- The right: what the assistant made (the map, the table, files, a
           script, a note). It opens when there is something to show. -->
      <aside class="outputs" id="outputs" aria-label="What the assistant made" hidden>
        <div class="splitter" id="splitter" role="separator" aria-orientation="vertical" aria-label="Width of the panel on the right" tabindex="0"></div>
        <header class="out-head" id="out-head"></header>
        <div class="out-body">
          <!-- A session's map and table: chart paper until one is shown. -->
          <div class="stage" id="stage"><div class="frames" id="stage-frames"></div></div>
          <!-- Something to read over it: files, how a result was made, a script, a note. -->
          <section class="side" id="side" hidden></section>
        </div>
      </aside>
    </div>
    <div id="toast" class="toast" popover="manual" role="status" aria-live="polite" hidden></div>
    <dialog id="palette" class="palette" aria-label="Search chats, data, workflows and pages">
      <input id="palette-q" type="search" placeholder="Search chats, data, workflows and pages" aria-label="Search chats, data, workflows and pages" autocomplete="off" spellcheck="false" role="combobox" aria-expanded="true" aria-controls="palette-list" />
      <ul id="palette-list" role="listbox" aria-label="Results"></ul>
      <p class="hint">↑ ↓ to move · Enter to open · Esc to close. Chats are searched by title and content; connections, workflows and projects by name.</p>
    </dialog>
    <script type="module" src="js/main.js"></script>
  </body>
</html>
