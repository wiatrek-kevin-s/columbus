[package]
name = "columbus-desktop"
version = "0.3.3"
edition = "2021"
license = "Apache-2.0"
description = "The Columbus desktop app"
rust-version = "1.85"

[[bin]]
name = "columbus-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
tauri = { version = "=2.12.5", features = [] }
tauri-plugin-deep-link = "=2.6.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
columbus-chat = { path = "../../../crates/chat" }
tokio = { version = "1", features = ["sync", "time"] }
keyring-core = "1"

# The API key lives in the operating system's credential store.
[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1", features = ["keychain"] }
[target.'cfg(windows)'.dependencies]
windows-native-keyring-store = "1"

[target.'cfg(any(windows, target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = { version = "=2.5.5", features = ["deep-link"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
