# Organization policy: %ProgramData%\Columbus\policy.yaml
# Writable only by administrators; can be pushed by Intune. Settings narrow
# what Columbus allows (limits can be raised, within a fixed ceiling, with
# limits.allow_raise). With no file, the defaults are: local
# GeoPackage/SQLite only, read-only, no scripts, no edits.

# Connection types allowed at all.
connection_types: [gpkg, sqlite, oracle, sqlserver, postgis, rasters]

# Hosts any connection may reach (wildcards allowed).
hosts: ["*.corp.example", "oraprod.corp.example"]

# Tools: leave empty to allow all built-in tools; deny_tools always wins.
tools: []
deny_tools: []

allow_scripts: false   # run_python (always approved per call when allowed)
allow_edits: false     # read-write connections are treated as read-only while false

# Rows read per query and seconds per call. Lower values always apply;
# values above the defaults (200,000 rows, 120 s) apply only with
# allow_raise: true, and never past 20,000,000 rows or 3,600 s. Connections
# can only lower them further. Large results are written to the workspace in
# batches, so memory does not grow with the rows read.
limits:
  rows: 200000         # e.g. 2000000 with allow_raise: true
  seconds: 120         # e.g. 900 with allow_raise: true
  allow_raise: false

# Project databases: local DuckDB files the assistant builds from governed
# results and joins with SQL (they write only their own file).
project_db:
  enabled: true
  memory_mb: 2048      # engine memory per call; beyond it work spills to disk
  max_mb: 20480        # most disk one database (and its spill folder) may take;
                       # over it, loads and changes other than DROP/DELETE are refused

return_rows: 500       # rows sent to the AI provider per call (500 is the maximum)

# Fields never returned to the agent (wildcards, case-insensitive).
hide_fields: ["*SSN*", "OWNER_NAME", "*_PHONE"]

# Connected MCP servers (design change 1).
servers:
  allow_personal: false          # only organization-managed manifests
  allow: []                      # server ids allowed at all; empty = any organization manifest
  allow_unconfined_local: false  # local servers wait for confinement; true only for pilots

# Data-flow rules. While data from a connection is in the session, writes and
# uploads to connected servers need approval; these rules can forbid them.
# The most specific rule wins; deny beats approve at equal specificity.
flows:
  - from: [connection:roads-prod, connection:assets-prod]
    to:   ["*"]                 # any connected MCP server and any export folder
    action: deny
  - from: [connection:roads-prod]
    to:   [server:sharepoint]
    action: approve             # allowed, with an approval

# Engine plugins. Each runs only after `columbus-mcp plugins approve <id>`.
plugins:
  allow_personal: false          # only plugins installed under %ProgramData%
  allow: []                      # plugin ids allowed at all; empty = any installed plugin

# Approvals. People are asked in their AI client when it can show prompts;
# otherwise on Columbus's local approvals page in their browser.
approvals:
  page: true                     # false: clients without prompts cannot get approvals
  wait_seconds: 45               # how long a call waits for the person on the page (max 300)

# Folders export_output may write to; nothing can be exported anywhere else.
# granted: true means no approval when every check passes and no flow rule
# says otherwise. Use folder:<id> in flow rules to treat one specially.
exports:
  - { id: district-share, path: '\\fileserver\gis\deliverables', granted: true }
  - { id: outbox, path: 'C:\Users\Public\Columbus outbox' }

# Hosts registry_fetch may download open data from without asking. Any other
# host (still public HTTPS only) needs the person's approval.
fetch_hosts: ["tigerweb.geo.census.gov", "hazards.fema.gov", "*.arcgis.com"]

# Notes Columbus drafts from a connection's database (draft_notes, or Draft
# notes in the app): list the codes short fields hold, as code lists to label.
# Off: fields, types, keys, relationships and comments only.
# ask_each_change: ask the person about every change the assistant makes to
# their notes. Off: one approval per batch, and "allow for this session".
notes: { values: true, ask_each_change: false }
