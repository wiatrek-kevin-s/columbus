# A registered Python environment (F-4): environments/<id>.yaml, beside the
# connections folder. You don't write this file by hand: register one at
# the keyboard with
#   columbus-mcp env add pro --python <path to python.exe> [--trust governed|trusted]
# or Settings > Environments > Add environment in the app. Columbus runs a
# probe and writes the probe and confirmed_at itself; its confirmation is
# kept apart (environments/.confirmed.json), so editing this file marks the
# environment "changed" and it stops running until confirmed again
# (columbus-mcp env confirm pro). Policy must say environments.allow: true
# (and allow_trusted: true for a trusted one). This example shows the shape.
#
# trust: governed (the default) runs scripts confined, extracts only, at
# confinement A (no network) or B (network; policy allow_network). trusted
# (experimental) runs scripts unconfined as the person, every run approved;
# arcpy is expected to need it. Personal tools and workflow steps use
# governed level-A environments only.
