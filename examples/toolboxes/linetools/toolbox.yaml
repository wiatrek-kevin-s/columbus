# A toolbox (F-16): toolboxes/<id>/toolbox.yaml in your toolboxes folder
# (beside your tools folder). A toolbox is a command-line program that
# describes its own tools; your assistant finds them with search_tools and
# runs them with run_tool as <id>.<tool>, in the same sandbox as scripts.
#
# You don't write this file by hand. Columbus writes it when you add the
# program at the keyboard:
#   columbus-mcp toolbox add C:\Tools\linetools\linetools.exe --id linetools --kind described
#       --tools tools.json --name "Line tools" --version 2.1 --licence MIT
# or Tools > Add tools > A program on this computer in the app. What you
# write is tools.json (beside this file): each tool's id, summary, command
# line (args, with {name} where a parameter's value goes) and parameters.
# Policy must say allow_toolboxes: true.
#
# The program runs only while its file has the SHA-256 below, and the
# description only while tools.json has tools_sha256: after a change to
# either, remove the toolbox and add it again. This example shows the shape.
#
# kind: described (a program with a tools.json) or geolibre (the GeoLibre
# runner, which lists its own tools; install it from the catalogue with
# `columbus-mcp toolbox install geolibre`, or Tools > Add tools > GeoLibre).
