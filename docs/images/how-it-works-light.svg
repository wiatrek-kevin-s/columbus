<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 330" width="920" height="330" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" role="img" aria-labelledby="t d"><title id="t">How Columbus works</title><desc id="d">Your AI app asks Columbus. Columbus checks every request against your organization's rules, asks you before anything is exported or changed, and logs every step. Only then does it read your data or run your Python, on your computer.</desc><rect x="10" y="95" width="200" height="140" rx="10" fill="#f6f8fa" stroke="#d1d9e0" stroke-width="1.5"/><text x="110" y="128" font-size="16" font-weight="600" fill="#1f2328" text-anchor="middle">Your AI app</text><text x="30" y="158" font-size="13" font-weight="400" fill="#59636e" text-anchor="start">Columbus's own chat,</text><text x="30" y="177" font-size="13" font-weight="400" fill="#59636e" text-anchor="start">Claude, Copilot, or</text><text x="30" y="196" font-size="13" font-weight="400" fill="#59636e" text-anchor="start">another AI app</text><line x1="210" y1="165" x2="282" y2="165" stroke="#59636e" stroke-width="2"/><path d="M290 165 l-10 -6 v12 z" fill="#59636e"/><text x="250.0" y="155" font-size="12" font-weight="400" fill="#59636e" text-anchor="middle">asks</text><rect x="290" y="20" width="310" height="290" rx="14" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/><text x="445" y="52" font-size="18" font-weight="700" fill="#0969da" text-anchor="middle">Columbus</text><text x="445" y="72" font-size="12" font-weight="400" fill="#59636e" text-anchor="middle">on your computer</text><rect x="308" y="86" width="274" height="66" rx="8" fill="#f6f8fa" stroke="#d1d9e0" stroke-width="1.5"/><circle cx="328" cy="106" r="7" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.5"/><path d="M324.5 106 l2.5 2.5 l4.5 -5" stroke="#1a7f37" stroke-width="1.8" fill="none"/><text x="344" y="111" font-size="14" font-weight="600" fill="#1f2328" text-anchor="start">Rules</text><text x="324" y="130" font-size="12" font-weight="400" fill="#59636e" text-anchor="start">Read-only by default; only the rows</text><text x="324" y="144" font-size="12" font-weight="400" fill="#59636e" text-anchor="start">and fields your organization allows</text><rect x="308" y="160" width="274" height="66" rx="8" fill="#f6f8fa" stroke="#d1d9e0" stroke-width="1.5"/><circle cx="328" cy="180" r="7" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.5"/><path d="M324.5 180 l2.5 2.5 l4.5 -5" stroke="#1a7f37" stroke-width="1.8" fill="none"/><text x="344" y="185" font-size="14" font-weight="600" fill="#1f2328" text-anchor="start">Approvals</text><text x="324" y="204" font-size="12" font-weight="400" fill="#59636e" text-anchor="start">Exports, edits and scripts</text><text x="324" y="218" font-size="12" font-weight="400" fill="#59636e" text-anchor="start">wait for your yes</text><rect x="308" y="234" width="274" height="66" rx="8" fill="#f6f8fa" stroke="#d1d9e0" stroke-width="1.5"/><circle cx="328" cy="254" r="7" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.5"/><path d="M324.5 254 l2.5 2.5 l4.5 -5" stroke="#1a7f37" stroke-width="1.8" fill="none"/><text x="344" y="259" font-size="14" font-weight="600" fill="#1f2328" text-anchor="start">Checks and log</text><text x="324" y="278" font-size="12" font-weight="400" fill="#59636e" text-anchor="start">Every result checked,</text><text x="324" y="292" font-size="12" font-weight="400" fill="#59636e" text-anchor="start">every step written down</text><line x1="600" y1="105" x2="672" y2="105" stroke="#59636e" stroke-width="2"/><path d="M680 105 l-10 -6 v12 z" fill="#59636e"/><text x="640.0" y="95" font-size="12" font-weight="400" fill="#59636e" text-anchor="middle">reads</text><line x1="600" y1="240" x2="672" y2="240" stroke="#59636e" stroke-width="2"/><path d="M680 240 l-10 -6 v12 z" fill="#59636e"/><text x="640.0" y="230" font-size="12" font-weight="400" fill="#59636e" text-anchor="middle">runs</text><rect x="680" y="20" width="230" height="165" rx="10" fill="#f6f8fa" stroke="#d1d9e0" stroke-width="1.5"/><text x="700" y="48" font-size="16" font-weight="600" fill="#1f2328" text-anchor="start">Your data</text><text x="700" y="74" font-size="12" font-weight="400" fill="#59636e" text-anchor="start">Oracle and SQL Server</text><text x="700" y="93" font-size="12" font-weight="400" fill="#59636e" text-anchor="start">File geodatabases, shapefiles</text><text x="700" y="112" font-size="12" font-weight="400" fill="#59636e" text-anchor="start">ArcGIS Online and Portal</text><text x="700" y="131" font-size="12" font-weight="400" fill="#59636e" text-anchor="start">CSV, Excel, GeoPackage</text><text x="700" y="150" font-size="12" font-weight="400" fill="#59636e" text-anchor="start">Rasters, PostGIS</text><rect x="680" y="195" width="230" height="115" rx="10" fill="#f6f8fa" stroke="#d1d9e0" stroke-width="1.5"/><text x="700" y="223" font-size="16" font-weight="600" fill="#1f2328" text-anchor="start">Your Python</text><text x="700" y="249" font-size="12" font-weight="400" fill="#59636e" text-anchor="start">Columbus's GIS tools, your</text><text x="700" y="268" font-size="12" font-weight="400" fill="#59636e" text-anchor="start">own Python setups, and</text><text x="700" y="287" font-size="12" font-weight="400" fill="#59636e" text-anchor="start">ArcGIS Pro's arcpy (experimental)</text></svg>
